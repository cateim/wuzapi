# Image of this fork: upstream plus the changes the Radar needs before upstream
# ships them (custom link preview fields on /chat/send/text). Built on a native
# arm64 runner because the Radar server is ARM. The upstream workflow that
# publishes to Docker Hub only runs on releases and needs the upstream secrets,
# so it never fires here.
#
# Fork only: this file must not go into any pull request to asternic/wuzapi.
name: Fork image (arm64)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tags
        id: tags
        run: |
          echo "stamp=radar.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/wuzapi:latest
            ghcr.io/${{ github.repository_owner }}/wuzapi:${{ steps.tags.outputs.stamp }}
            ghcr.io/${{ github.repository_owner }}/wuzapi:sha-${{ steps.tags.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
